pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    // the root build.gradle's android_plugin_version
    id("com.android.settings") version '9.4.1'
}

android {
    // Nağmedar 1.0.3: Android 14, for libVLC 4 and the VLC 3 branch (-PforceVlc3) alike. The owner's
    // devices run Android 16 and 17; AndroidX (navigation 2.10) needs 23 at least, and 34 is Desktop
    // Kit 2.x's floor: the platform's predictive Back, caption bar insets and haptic constants are
    // there without fallbacks
    minSdk = 34
    // Nağmedar 1.0.3: Android 17's SDK and its behaviour (the owner's decision of 12 Nov 2026; build.gradle,
    // targetSdkVersion): the local network permission, the alarm's page, the widget's bitmap limit
    targetSdk = 37
    compileSdk = 37
    buildToolsVersion = '36.0.0'
}

include ':libvlcjni:libvlc', ':medialibrary'
include ':application:tools', ':application:resources', ':application:mediadb', ':application:app', ':application:live-plot-graph', ':application:donations', ':application:remote-access-server'
include ':application:vlc-android'
include ':application:nagmedar-ui'
include ':application:nagmedar-data'
include ':application:nagmedar-session'
include ':application:nagmedar-lab'
include ':application:nagmedar-audio'
// S-1404: the macrobenchmarks, against the app's benchmark build
include ':application:benchmark'
include ':application:remote-access-client'
