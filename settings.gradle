pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id("com.android.settings") version '9.1.1'
}

// Nağmedar builds against libVLC 4 by default; -PforceVlc3 selects the VLC 3 branch.
def vlcMajorVersion = hasProperty('forceVlc3') ? 3 : 4

android {
    minSdk = vlcMajorVersion == 3 ? 17 : 23
    // Nağmedar 1.0: Android 17's SDK, Android 16's behaviour (build.gradle, targetSdkVersion)
    targetSdk = 36
    compileSdk = 37
    buildToolsVersion = '36.0.0'
}

include ':libvlcjni:libvlc', ':medialibrary'
include ':application:tools', ':application:resources', ':application:mediadb', ':application:app', ':application:live-plot-graph', ':application:television', ':application:donations', ':application:remote-access-server'
include ':application:vlc-android'
include ':application:nagmedar-ui'
include ':application:nagmedar-data'
include ':application:nagmedar-session'
include ':application:nagmedar-lab'
include ':application:nagmedar-audio'
// S-1404: the macrobenchmarks, against the app's benchmark build
include ':application:benchmark'
include ':application:moviepedia'
include ':application:remote-access-client'
