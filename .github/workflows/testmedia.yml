# S-1401: builds the test media set from testmedia/manifest.json, checks every sample
# and publishes it as the "nagmedar-test-media" artifact. Runs when testmedia/ changes
# or by hand; the output is cached until the generator or the manifest changes.
# 1.0.3: music, podcast and radio samples only (Nağmedar plays no video since 1.0).
name: Test medya seti

on:
  push:
    branches: [master]
    paths:
      - 'testmedia/**'
      - '.github/workflows/testmedia.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media:
    name: Test medya seti
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # 1.0.3: audio only (the video, HDR and Dolby Vision samples and their tools left with video in 1.0)
      - name: Araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil
          pip install --quiet --break-system-packages mutagen
          ffmpeg -hide_banner -version | head -1

      - name: Önbellek
        id: cache
        uses: actions/cache@v4
        with:
          path: out/testmedia
          key: testmedia-${{ hashFiles('testmedia/**', 'application/nagmedar-ui/src/main/res/font/*') }}

      - name: Üret
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python3 testmedia/generate.py out/testmedia --work "$RUNNER_TEMP/work" 2>&1 | tee "$RUNNER_TEMP/generate.log" || {
            echo "::error title=Üretim günlüğü::$(tail -c 2500 "$RUNNER_TEMP/generate.log" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          }

      - name: Doğrula
        run: python3 testmedia/verify.py out/testmedia

      - name: Özet
        if: always()
        run: |
          if [ -f out/testmedia/index.md ]; then
            { echo "## Test medya seti"; echo; echo "Boyut: $(du -sh out/testmedia | cut -f1)"; echo; cat out/testmedia/index.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY'
          import json, os
          path = 'out/testmedia/index.json'
          if os.path.exists(path):
              for s in json.load(open(path))['samples']:
                  if s.get('problems'):
                      print('::error title=Test medyası %s::%s' % (s['id'], '; '.join(s['problems'])[:900].replace('\n', ' ')))
          PY

      - name: Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagmedar-test-media
          path: out/testmedia
          retention-days: 30
          compression-level: 0
          if-no-files-found: ignore
