# Nağmedar CI
#
# lab-native: the native lab library (FFmpeg for the media probe, libusb; SP-02/03, S-802) and
#            the music engine (S-901, native/audio) for arm64. Cached until native/lab, native/audio
#            or buildsystem/nagmedar-native changes.
# native-host: the host tests of the media probe and the engine's bit-exact decoding, on every
#            run that runs the tests, whether lab-native's libraries came from the cache or not.
# app      : every push / PR. Builds the arm64 debug APK, the arm64 personal build (R8, the
#            release-type build personal_release delivers) and the macrobenchmarks with the
#            benchmark build they measure (S-1404), none uploaded, against the published libVLC 4
#            AAR, without native compilation, on the hosted runner's Android SDK; each leg notes
#            its APK's size (an annotation). The debug leg also runs the
#            Nağmedar UI tests (tokens, shortcuts, layout state, accessibility gate,
#            screenshots), compares the screenshots with src/test/screenshots and, on
#            master, pushes them to the ci/screenshots branch for review. Compiler errors
#            and test failures become check-run annotations, as does what the debug leg's
#            vlc_visuals.py finds: VLC's glyphs in Nağmedar's code, VLC's orange in the
#            launcher's icons. Both legs build the remote
#            access web app (VideoLAN's, pinned, with Nağmedar's patches: S-1304) into the APK
#            and check that it is Nağmedar's; the debug leg also walks the built page in
#            headless Chrome and pushes its screenshots to ci/web (a pull request's to
#            ci/web-pr-<number>).
# release  : manual (İmzalı release APK üret) or v* tags. Signed release APKs, with the lab's
#            libraries, into a DRAFT GitHub release with CHANGELOG.md's notes (S-1503): only those
#            who can push see it; never published, never an artifact. Needs the keystore secrets
#            (NAGMEDAR_KEYSTORE_BASE64, NAGMEDAR_KEYSTORE_PASSWORD, NAGMEDAR_KEY_ALIAS); without
#            them it is skipped with a notice. buildsystem/release/README.md has the steps.
# personal-release: manual only (Kişisel sürüm: personal_release). The arm64 personal build with
#            the lab's libraries (app.nagmedar.debug, signed with the shared debug key: it installs
#            over the debug build), checked and encrypted with the owner's delivery key
#            (buildsystem/release/delivery.pub); only the ciphertext is pushed, to the orphan branch
#            ci/personal-release, replaced each run. buildsystem/release/README.md has the steps.
# native   : manual only. Rebuilds libVLC from source for one ABI inside the
#            VideoLAN Docker image (slow; uses prebuilt contribs when available), then the
#            app's dev APK with it: Nağmedar's own libVLC (libvlcjni/nagmedar, S-503 …
#            S-508), its additions found at run time by the new interface.

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'İmzalı release APK üret'
        type: boolean
        default: false
      personal_release:
        description: 'Kişisel sürüm: arm64 personal APK, şifreli, ci/personal-release dalına'
        type: boolean
        default: false
      native_abi:
        description: 'Native libVLC derlemesi (yok: yapılmaz)'
        type: choice
        options: [yok, arm64, arm, x86_64]
        default: yok

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4
  # Tests paused until the test phase: the app, its unit tests and the native libraries are
  # compiled, but no test runs and no screenshot is compared. '1' runs them all again.
  NAGMEDAR_RUN_TESTS: '1'
  # The app's API keys (S-1101 Podcast Index, S-1008 Last.fm) are given to the Gradle builds
  # alone, in their steps' env: the other steps, the actions and the tools they download never
  # see them.
  # get-vlc.sh applies VLC patches with "git am", which needs a committer identity.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  lab-native:
    name: Laboratuvar native (SP-02/03)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Önbellek
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            application/nagmedar-lab/src/main/jniLibs
            application/nagmedar-audio/src/main/jniLibs
          key: lab-native-${{ hashFiles('native/lab/**', 'native/audio/**', 'buildsystem/nagmedar-native/**') }}

      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Araçlar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mkvtoolnix ffmpeg nasm
          # S-1003: the lyrics tests write SYLT frames with it
          pip install --quiet --break-system-packages mutagen

      - name: Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./buildsystem/ci/setup-android.sh

      - name: arm64 derlemesi
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          ./buildsystem/nagmedar-native/build.sh android "$RUNNER_TEMP/native-android" 2>&1 | tee "$RUNNER_TEMP/android.log" || {
            echo "::error title=arm64 günlüğü::$(tail -c 3000 "$RUNNER_TEMP/android.log" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: lab-jnilibs
          path: |
            application/nagmedar-lab/src/main/jniLibs
            application/nagmedar-audio/src/main/jniLibs
          if-no-files-found: error

  # The native host tests, whenever the tests run: the arm64 libraries above come from their cache
  # when native/ did not change, a test result never does. A job of its own, so that the app's
  # jobs do not wait for it; the host build (FFmpeg, TagLib, …) is made again each time.
  native-host:
    name: Laboratuvar native · host testleri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        if: env.NAGMEDAR_RUN_TESTS == '1'

      - uses: actions/setup-java@v5
        if: env.NAGMEDAR_RUN_TESTS == '1'
        with:
          distribution: temurin
          java-version: '17'

      - name: Araçlar
        if: env.NAGMEDAR_RUN_TESTS == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mkvtoolnix ffmpeg nasm
          # S-1003: the lyrics tests write SYLT frames with it
          pip install --quiet --break-system-packages mutagen

      # S-802 (test-host.sh) and the music engine's (test-audio.sh)
      - name: Host derlemesi ve testleri (S-802)
        if: env.NAGMEDAR_RUN_TESTS == '1'
        env:
          NAGMEDAR_TEST_DIR: ${{ runner.temp }}/host-test
          TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          { ./buildsystem/nagmedar-native/build.sh host "$RUNNER_TEMP/native-host" &&
            ./buildsystem/nagmedar-native/test-host.sh "$RUNNER_TEMP/native-host"; } 2>&1 | tee "$RUNNER_TEMP/host.log" || {
            echo "::error title=Host günlüğü::$(tail -c 3000 "$RUNNER_TEMP/host.log" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            # the failed test's files (small: the test streams are about 100 kB) on the ci/debug-native branch
            if [ -d "$NAGMEDAR_TEST_DIR" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              cp "$RUNNER_TEMP/host.log" "$NAGMEDAR_TEST_DIR/"
              cd "$NAGMEDAR_TEST_DIR" && find . -type f -size +50M -delete
              git init -q && git checkout -q --orphan ci/debug-native
              git add -A && git commit -q -m "Native host test files for ${GITHUB_SHA::7}"
              git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/debug-native || true
            fi
            exit 1
          }

  app:
    name: Uygulama · ${{ matrix.variant }}
    needs: lab-native
    # the app still builds when the lab libraries fail; the Lab screen then says they are missing
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    steps:
      - uses: actions/checkout@v5

      - name: Laboratuvar kitaplıkları
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lab-jnilibs
          path: application

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK ve NDK
        run: ./buildsystem/ci/setup-android.sh

      # S-1304: the remote access web app in the APK (assets of remote-access-client), Nağmedar's
      - name: Uzaktan erişim web uygulaması
        id: web
        uses: ./.github/actions/remoteaccess-web

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gradle-9.3.1
          key: gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'buildsystem/compile.sh') }}
          restore-keys: gradle-

      - name: Hazırlık (libvlcjni, VLC kaynağı, Gradle)
        run: ./buildsystem/compile.sh --init 2>&1 | tee init.log

      - name: Kaynak zinciri
        if: matrix.variant == 'debug'
        run: ./buildsystem/ci/source_chain.sh

      - name: Derleme (${{ matrix.variant }})
        env:
          # Nağmedar's own API keys, baked into BuildConfig; empty where the secrets are not set
          NAGMEDAR_PODCASTINDEX_KEY: ${{ secrets.NAGMEDAR_PODCASTINDEX_KEY }}
          NAGMEDAR_PODCASTINDEX_SECRET: ${{ secrets.NAGMEDAR_PODCASTINDEX_SECRET }}
          NAGMEDAR_LASTFM_API_KEY: ${{ secrets.NAGMEDAR_LASTFM_API_KEY }}
          NAGMEDAR_LASTFM_SECRET: ${{ secrets.NAGMEDAR_LASTFM_SECRET }}
        run: |
          if [ "${{ matrix.variant }}" = release ]; then
            # Nağmedar 1.0: R8's build, as personal_release delivers it (arm64; release and
            # signedRelease are the same code and rules under another identity)
            ./gradlew :application:app:assemblePersonal -PnagmedarAbis=arm64-v8a --console=plain 2>&1 | tee build.log
            # S-1404: the macrobenchmarks and the app's benchmark build they measure, arm64
            ./gradlew :application:app:assembleBenchmark :application:benchmark:assembleBenchmark \
              -PnagmedarAbis=arm64-v8a --console=plain 2>&1 | tee -a build.log
          elif [ "$NAGMEDAR_RUN_TESTS" != 1 ]; then
            # tests paused: the debug APK, and the unit tests compiled so they stay buildable
            ./gradlew :application:app:assembleDebug :application:nagmedar-ui:compileDebugUnitTestSources \
              :application:tools:compileDebugUnitTestSources :application:nagmedar-data:compileDebugUnitTestSources \
              :application:nagmedar-session:compileDebugUnitTestSources :application:nagmedar-lab:compileDebugUnitTestSources \
              :application:nagmedar-audio:compileDebugUnitTestSources \
              -PnagmedarAbis=arm64-v8a --continue --console=plain 2>&1 | tee build.log
          else
            # arm64 only (Tab S11 Ultra); signed with the shared debug key so it updates in place
            ./gradlew :application:app:assembleDebug :application:nagmedar-ui:testDebugUnitTest \
              :application:tools:testDebugUnitTest :application:nagmedar-data:testDebugUnitTest \
              :application:nagmedar-session:testDebugUnitTest :application:nagmedar-lab:testDebugUnitTest \
              :application:nagmedar-audio:testDebugUnitTest \
              -PnagmedarAbis=arm64-v8a --continue --console=plain 2>&1 | tee build.log
          fi

      - name: Hataları işaretle
        if: failure()
        run: python3 buildsystem/ci/annotate_gradle_errors.py init.log build.log

      # the arm64 APKs' sizes: the debug build's beside the personal one's that R8 made
      - name: APK boyutu
        if: success()
        run: |
          find application/app/build/outputs/apk -name '*.apk' | sort | while read -r apk; do
            echo "::notice title=APK boyutu::$(basename "$apk"): $(stat -c %s "$apk") bytes"
          done

      # VLC's notification, widget and speed glyphs out of Nağmedar's code, its orange out of the
      # launcher's icon and shortcuts (the classic UI's review); the build's own result stays above
      - name: Arayüzde VLC görseli yok
        if: ${{ !cancelled() && matrix.variant == 'debug' }}
        run: python3 buildsystem/ci/vlc_visuals.py .

      # a failed or hung build's log and test results on the ci/debug-app branch, readable with git
      # where the run's own logs are not (the job log names each test as it starts and ends)
      # (a pull request's on ci/debug-pr-<number>)
      - name: Günlüğü ci/debug-app dalına koy
        if: failure() && matrix.variant == 'debug' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ github.token }}
          TARGET: ${{ github.event_name == 'pull_request' && format('ci/debug-pr-{0}', github.event.pull_request.number) || 'ci/debug-app' }}
        run: |
          out="$RUNNER_TEMP/debug-app"
          rm -rf "$out" && mkdir -p "$out"
          for f in init.log build.log; do [ -f "$f" ] && cp "$f" "$out"/; done
          find application -path '*/build/test-results/*' -name '*.xml' -size -4M -print0 2>/dev/null | xargs -0 -r cp --parents -t "$out"
          cd "$out"
          git init -q && git checkout -q --orphan "$TARGET"
          git add -A && git commit -q -m "App build log for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET" || true

      - name: Ekran görüntülerini karşılaştır
        if: always() && matrix.variant == 'debug' && env.NAGMEDAR_RUN_TESTS == '1'
        run: |
          pip install --quiet pillow
          python3 buildsystem/ci/screenshot_report.py \
            application/nagmedar-ui/build/outputs/screenshots \
            application/nagmedar-ui/src/test/screenshots \
            application/nagmedar-ui/build/outputs/screenshots/diff

      # a pull request's (from this repository) go to ci/shots-pr-<number>, for its review
      - name: Ekran görüntülerini ci/screenshots dalına koy
        if: always() && matrix.variant == 'debug' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ github.token }}
          TARGET: ${{ github.event_name == 'pull_request' && format('ci/shots-pr-{0}', github.event.pull_request.number) || 'ci/screenshots' }}
        run: |
          src=application/nagmedar-ui/build/outputs/screenshots
          # exported Room schemas, to be committed under application/nagmedar-data/schemas
          schemas=application/nagmedar-data/schemas
          [ -d "$src" ] || [ -d "$schemas" ] || exit 0
          out="$RUNNER_TEMP/screenshots"
          rm -rf "$out" && mkdir -p "$out"
          [ -d "$src" ] && cp -r "$src"/. "$out"/
          [ -d "$schemas" ] && cp -r "$schemas" "$out"/schemas
          cd "$out"
          git init -q && git checkout -q --orphan "$TARGET"
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET"

      # S-1304: the built page in headless Chrome against a mock of the app's server (the security
      # page, the one-time code wrong and right, the library, the player, About; Turkish and English,
      # light and dark, desktop and phone); a pull request's go to ci/web-pr-<number>. A look, not
      # a gate: the build and check-dist.sh above decide the job
      - name: Uzaktan erişim web arayüzü görünümü
        id: web-preview
        if: always() && matrix.variant == 'debug' && steps.web.outcome == 'success'
        continue-on-error: true
        run: |
          pip install --quiet playwright
          python3 buildsystem/remoteaccess/preview.py --channel chrome \
            --dist application/remote-access-client/remoteaccess/dist --repo . --out "$RUNNER_TEMP/web-shots"

      - name: Web görüntülerini dala koy
        if: always() && steps.web-preview.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ github.token }}
          TARGET: ${{ github.event_name == 'pull_request' && format('ci/web-pr-{0}', github.event.pull_request.number) || 'ci/web' }}
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/web-shots"
          git init -q && git checkout -q --orphan "$TARGET"
          git add -A && git commit -q -m "Remote access web screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET"

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.variant }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore

  # S-1503: the signed APKs go only into a draft GitHub release, which those who can push to the
  # repository alone see; never published from here, never an artifact (the repository is public)
  release:
    name: İmzalı sürüm (taslak)
    needs: lab-native
    if: ${{ !cancelled() && needs.lab-native.result == 'success' && (github.event_name == 'workflow_dispatch' && inputs.release || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.NAGMEDAR_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      # the lab's native libraries (arm64): the Lab's tools, the media probe and the subtitle tools
      - name: Laboratuvar kitaplıkları
        uses: actions/download-artifact@v4
        with:
          name: lab-jnilibs
          path: application

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Anahtar deposu yoksa atla
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice title=Sürüm::NAGMEDAR_KEYSTORE_BASE64 tanımlı değil; imzalı sürüm atlandı (buildsystem/release/README.md)."
      - name: Sürüm notları
        if: env.HAS_KEYSTORE == 'true'
        run: |
          VERSION=$(python3 buildsystem/release/notes.py --version)
          python3 buildsystem/release/notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Uzaktan erişim web uygulaması
        if: env.HAS_KEYSTORE == 'true'
        uses: ./.github/actions/remoteaccess-web
      - name: Hazırlık
        if: env.HAS_KEYSTORE == 'true'
        run: |
          ./buildsystem/ci/setup-android.sh
          ./buildsystem/compile.sh --init 2>&1 | tee init.log
      - name: İmzalı derleme
        if: env.HAS_KEYSTORE == 'true'
        env:
          # Nağmedar's own API keys, baked into BuildConfig; empty where the secrets are not set
          NAGMEDAR_PODCASTINDEX_KEY: ${{ secrets.NAGMEDAR_PODCASTINDEX_KEY }}
          NAGMEDAR_PODCASTINDEX_SECRET: ${{ secrets.NAGMEDAR_PODCASTINDEX_SECRET }}
          NAGMEDAR_LASTFM_API_KEY: ${{ secrets.NAGMEDAR_LASTFM_API_KEY }}
          NAGMEDAR_LASTFM_SECRET: ${{ secrets.NAGMEDAR_LASTFM_SECRET }}
          KEYSTORE_B64: ${{ secrets.NAGMEDAR_KEYSTORE_BASE64 }}
          PASSWORD_KEYSTORE: ${{ secrets.NAGMEDAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NAGMEDAR_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nagmedar.keystore"
          ./gradlew :application:app:assembleSignedRelease --console=plain \
            -PkeyStoreFile="$RUNNER_TEMP/nagmedar.keystore" -Pstorealias="$KEY_ALIAS" 2>&1 | tee build.log
          rm -f "$RUNNER_TEMP/nagmedar.keystore"
      - name: Hataları işaretle
        if: failure()
        run: python3 buildsystem/ci/annotate_gradle_errors.py init.log build.log
      - name: Taslak sürüm
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          apks=application/app/build/outputs/apk/signedRelease
          (cd "$apks" && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft" 2>/dev/null; then
            # a published release is the owner's: CI never changes it
            if [ "$(cat "$RUNNER_TEMP/draft")" != true ]; then
              echo "::error title=Sürüm::$tag yayımlanmış; CI ona dokunmaz. Yeni bir sürüm için versionName'i artırın."
              exit 1
            fi
            gh release edit "$tag" --draft --title "Nağmedar $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          else
            gh release create "$tag" --draft --title "Nağmedar $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "$apks"/*.apk "$apks/SHA256SUMS" --clobber
          echo "::notice title=Taslak sürüm::Nağmedar $VERSION ($tag): Releases'ta taslak olarak duruyor; yalnızca depoya yazabilenler görür."

  # Nağmedar 1.0: the owner's own release for his two arm64 devices; never published, never an
  # artifact: the APK leaves the runner encrypted, and only its owner's delivery key opens it
  personal-release:
    name: Kişisel sürüm (şifreli)
    needs: lab-native
    if: ${{ !cancelled() && needs.lab-native.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.personal_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # the lab's and the music engine's native libraries (arm64): the release has them
      - name: Laboratuvar kitaplıkları
        uses: actions/download-artifact@v4
        with:
          name: lab-jnilibs
          path: application

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK ve NDK
        run: ./buildsystem/ci/setup-android.sh

      - name: Uzaktan erişim web uygulaması
        uses: ./.github/actions/remoteaccess-web

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gradle-9.3.1
          key: gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'buildsystem/compile.sh') }}
          restore-keys: gradle-

      - name: Hazırlık (libvlcjni, VLC kaynağı, Gradle)
        run: ./buildsystem/compile.sh --init 2>&1 | tee init.log

      - name: Derleme (personal, arm64)
        env:
          # Nağmedar's own API keys, baked into BuildConfig; empty where the secrets are not set
          NAGMEDAR_PODCASTINDEX_KEY: ${{ secrets.NAGMEDAR_PODCASTINDEX_KEY }}
          NAGMEDAR_PODCASTINDEX_SECRET: ${{ secrets.NAGMEDAR_PODCASTINDEX_SECRET }}
          NAGMEDAR_LASTFM_API_KEY: ${{ secrets.NAGMEDAR_LASTFM_API_KEY }}
          NAGMEDAR_LASTFM_SECRET: ${{ secrets.NAGMEDAR_LASTFM_SECRET }}
        run: ./gradlew :application:app:assemblePersonal -PnagmedarAbis=arm64-v8a --console=plain 2>&1 | tee build.log

      - name: Hataları işaretle
        if: failure()
        run: python3 buildsystem/ci/annotate_gradle_errors.py init.log build.log

      # checked (identity, signature, profile, engine), then encrypted; the APK is deleted after
      - name: Denetle ve şifrele
        run: |
          sh buildsystem/release/deliver_personal.sh application/app/build/outputs/apk/personal "$RUNNER_TEMP/delivery" \
            "${GITHUB_REF_NAME} @ ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          rm -rf application/app/build/outputs/apk

      - name: ci/personal-release dalına koy
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/delivery"
          git init -q && git checkout -q --orphan ci/personal-release
          git add -A && git commit -q -m "Nağmedar personal release of ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID}), encrypted"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/personal-release
          echo "::notice title=Kişisel sürüm::$(sed -n 's/^| versionCode | \(.*\) |$/versionCode \1/p' README.md); ci/personal-release dalında (şifreli)"

  native:
    name: Native libVLC (${{ inputs.native_abi }})
    needs: lab-native
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.native_abi != 'yok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: registry.videolan.org/vlc-debian-android:20260610055743
      options: --user root
    steps:
      - uses: actions/checkout@v5

      # the APK below carries the lab's libraries too
      - name: Laboratuvar kitaplıkları
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lab-jnilibs
          path: application

      - name: libVLC derlemesi
        run: |
          git config --global --add safe.directory '*'
          ./buildsystem/compile.sh -l -t -a ${{ inputs.native_abi }} 2>&1 | tee native.log

      # Nağmedar's own libVLC (libvlcjni/nagmedar: S-503 … S-508) in the app: the dev build
      # type takes libvlcjni and the medialibrary from source, as VLC's own dev builds do
      - name: Uygulama (dev, kendi libVLC'mizle)
        env:
          # Nağmedar's own API keys, baked into BuildConfig; empty where the secrets are not set
          NAGMEDAR_PODCASTINDEX_KEY: ${{ secrets.NAGMEDAR_PODCASTINDEX_KEY }}
          NAGMEDAR_PODCASTINDEX_SECRET: ${{ secrets.NAGMEDAR_PODCASTINDEX_SECRET }}
          NAGMEDAR_LASTFM_API_KEY: ${{ secrets.NAGMEDAR_LASTFM_API_KEY }}
          NAGMEDAR_LASTFM_SECRET: ${{ secrets.NAGMEDAR_LASTFM_SECRET }}
        run: ./buildsystem/compile.sh -t -a ${{ inputs.native_abi }} 2>&1 | tee app.log

      - name: Hataları işaretle
        if: failure()
        run: |
          python3 buildsystem/ci/annotate_gradle_errors.py native.log || true
          [ -f app.log ] && python3 buildsystem/ci/annotate_gradle_errors.py app.log || true
      - name: AAR ve .so
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: libvlc-${{ inputs.native_abi }}
          path: |
            libvlcjni/libvlc/build/outputs/aar/*.aar
            .dbg/**/*.so
          if-no-files-found: warn
      - name: APK (kendi libVLC'mizle)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nagmedar-native-${{ inputs.native_abi }}-apk
          path: application/app/build/outputs/apk/dev/*.apk
          if-no-files-found: warn
