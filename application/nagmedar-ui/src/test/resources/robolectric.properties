# Robolectric runs the Nağmedar UI tests on API 34. Screenshot and layout tests also
# switch to the native graphics stack with @GraphicsMode(NATIVE).
#
# Every Compose test goes there too (ComposeSandboxTest fails on one that does not). Each
# graphics mode is a sandbox of its own, and Compose's snapshot manager, once a Compose test
# starts it in a sandbox, posts its work on the main looper: a plain test that changes Compose
# state afterwards leaves that work behind, Robolectric drops it between tests, and every Compose
# test after it in the sandbox waits for an idle that never comes (the equaliser's tests, run
# early in the legacy sandbox, did this to the player's; then the lyrics editor's).
sdk=34
