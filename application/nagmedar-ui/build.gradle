// Nağmedar desktop-class UI (Jetpack Compose). Screens move here one by one from the
// XML/DataBinding UI in :application:vlc-android (ADR-02); playback keeps using the
// existing PlaybackService and medialibrary.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'app.nagmedar.ui'

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // S-706: Nağmedar's own OpenSubtitles.com API key, from the build's environment (a CI secret)
        // or a Gradle property; without one the subtitles' search says so
        buildConfigField 'String', 'OPENSUBTITLES_API_KEY', "\"${openSubtitlesKey(project)}\""
        // S-1101: Nağmedar's own Podcast Index key and secret, the same way; without them the podcast
        // search asks iTunes alone and says so
        buildConfigField 'String', 'PODCASTINDEX_KEY', "\"${podcastIndexValue(project, 'NAGMEDAR_PODCASTINDEX_KEY', 'nagmedar_podcastindex_key')}\""
        buildConfigField 'String', 'PODCASTINDEX_SECRET', "\"${podcastIndexValue(project, 'NAGMEDAR_PODCASTINDEX_SECRET', 'nagmedar_podcastindex_secret')}\""
        // S-1008: Nağmedar's own Last.fm API key and shared secret, from the build's environment (CI secrets)
        // or Gradle properties; without them Last.fm stays off and Settings says so
        buildConfigField 'String', 'LASTFM_API_KEY', "\"${secretValue('NAGMEDAR_LASTFM_API_KEY', 'nagmedar_lastfm_api_key', project)}\""
        buildConfigField 'String', 'LASTFM_SECRET', "\"${secretValue('NAGMEDAR_LASTFM_SECRET', 'nagmedar_lastfm_secret', project)}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        dev {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }
}

dependencies {
    implementation project(':application:vlc-android')
    implementation project(':application:nagmedar-data')
    implementation project(':application:nagmedar-lab')
    // S-901: whether this build carries the music engine (Settings › Music)
    implementation project(':application:nagmedar-audio')

    implementation platform("androidx.compose:compose-bom:$rootProject.ext.composeBomVersion")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime-livedata'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation "androidx.activity:activity-compose:$rootProject.ext.activityComposeVersion"
    implementation "androidx.navigation:navigation-compose:$rootProject.ext.navigationComposeVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$rootProject.ext.lifecycleComposeVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$rootProject.ext.lifecycleComposeVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.kotlinx_version"
    // S-1010: the converter's foreground jobs; S-1008: the job that sends the scrobbles waiting
    implementation "androidx.work:work-runtime-ktx:$rootProject.ext.workManagerVersion"

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    testImplementation "org.robolectric:robolectric:$rootProject.ext.nagmedarRobolectricVersion"
    testImplementation "androidx.test:core:$rootProject.ext.testCore"
    testImplementation "androidx.test.ext:junit:$rootProject.ext.junitExtVersion"
    testImplementation "androidx.work:work-testing:$rootProject.ext.workManagerVersion"
    testImplementation platform("androidx.compose:compose-bom:$rootProject.ext.composeBomVersion")
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

static def openSubtitlesKey(project) {
    def key = System.getenv('NAGMEDAR_OPENSUBTITLES_API_KEY') ?: project.findProperty('nagmedar_opensubtitles_api_key') ?: ''
    // only a key's characters: nothing that would break the generated Java string
    return key.toString().replaceAll('[^A-Za-z0-9_-]', '')
}

static def podcastIndexValue(project, envName, propertyName) {
    def value = (System.getenv(envName) ?: project.findProperty(propertyName) ?: '').toString().trim()
    // as the text of a Java string: the secret may hold $, ^ and #, so only the backslash and the quote are escaped
    // and control characters (a pasted line break) dropped
    return value.replaceAll('[\\p{Cntrl}]', '').replace('\\', '\\\\').replace('"', '\\"')
}

/** A build secret: the environment's [env] or the Gradle property [property], only its key characters. */
static def secretValue(String env, String property, project) {
    def value = System.getenv(env) ?: project.findProperty(property) ?: ''
    // only a key's characters: nothing that would break the generated Java string
    return value.toString().replaceAll('[^A-Za-z0-9_-]', '')
}
