plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// -PnagmedarAbis=arm64-v8a,... limits the native libraries: the ABIs of the split APKs of the
// release-type builds (assemble...Release, assemblePersonal), the abiFilters of the others
def nagmedarAbis = project.hasProperty('nagmedarAbis') ? project.property('nagmedarAbis').toString().split(',').collect { it.trim() }.findAll { it } : []
// one APK per ABI (and the ABI's digit in its versionCode) for these builds; the task may be
// named with its project path (:application:app:assemblePersonal)
def splitBuild = gradle.startParameter.taskNames.any { it.toLowerCase() ==~ /(.*:)?assemble.*(release|personal)/ }

android {
    compileOptions {
        coreLibraryDesugaringEnabled = true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/armeabi-v7a/libc++_shared.so', 'lib/armeabi/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    packaging {
        resources.excludes.add("META-INF/versions/9/OSGI-INF/MANIFEST.MF")
    }

    dataBinding {
        enabled = true
    }

    flavorDimensions "abi"

    defaultConfig {
        applicationId rootProject.ext.appId
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true

        testInstrumentationRunner "org.videolan.vlc.MultidexTestRunner"
        if (nagmedarAbis && !splitBuild) {
            ndk { abiFilters.addAll(nagmedarAbis) }
        }
        // The following argument makes the Android Test Orchestrator run its
        // "pm clear" command after each test invocation. This command ensures
        // that the app's state is completely cleared between tests.
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    signingConfigs {
        // Debug builds from every machine (and CI) share one key, so a newer debug APK
        // installs over the previous one instead of failing with a signature conflict.
        debug {
            def nagmedarDebugKeystore = rootProject.file('buildsystem/ci/nagmedar-debug.keystore')
            if (nagmedarDebugKeystore.exists()) {
                storeFile nagmedarDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            /*
            To set this properties, create file gradle.properties with these 3 props.
            e.g.
            keyStoreFile=/home/<username>/.android/debug.keystore
            storealias=androiddebugkey
            storepwd=android
             */
            if (project.hasProperty('keyStoreFile')) {
                storeFile file(project.findProperty('keyStoreFile'))
                keyAlias project.findProperty('storealias')
                if (System.getenv('PASSWORD_KEYSTORE') != null && !System.getenv('PASSWORD_KEYSTORE').isEmpty()) {
                    storePassword = System.getenv('PASSWORD_KEYSTORE')
                    keyPassword = System.getenv('PASSWORD_KEYSTORE')
                } else {
                    storePassword project.findProperty('storepwd')
                    keyPassword project.findProperty('storepwd')
                }
            }
        }
    }
    androidComponents {
        beforeVariants(selector().withBuildType("vlcBundle")) { variantBuilder ->
            variantBuilder.minSdk = 30
        }
        // Nağmedar 1.0: the Baseline Profile and the startup profile that orders the dex files,
        // collected on the CI emulator (buildsystem/benchmark/README.md), in every build R8 makes
        def baselineProfiles = file('src/main/baselineProfiles')
        onVariants(selector().all()) { variant ->
            if (baselineProfiles.isDirectory()) variant.sources.baselineProfiles?.addStaticSourceDirectory(baselineProfiles.absolutePath)
        }
    }

    buildTypes {
        // Nağmedar 1.0: R8 shrinks and optimizes every release-type build (signedRelease, benchmark
        // and personal start from this one); proguard-rules.pro keeps what JNI, reflection and
        // Moshi reach by name, res/raw/nagmedar_keep.xml the drawables the remote access page asks for
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            kotlin {
                compilerOptions {
                    freeCompilerArgs.addAll(['-Xno-param-assertions'])
                }
            }
        }
        signedRelease {
            initWith release
            signingConfig = signingConfigs.release
            matchingFallbacks = ['release']
        }
        vlcBundle {
            initWith release
            matchingFallbacks = ['release']
        }
        vlcBundleAmazon {
            initWith release
            matchingFallbacks = ['release']
        }
        // S-1404: what the macrobenchmarks (application/benchmark) measure: the release build,
        // profileable, signed with the shared debug key and installed beside the app
        benchmark {
            initWith release
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
            applicationIdSuffix ".benchmark"
            debuggable = false
            profileable = true
        }
        // Nağmedar 1.0: the owner's own release, delivered encrypted by CI (personal_release,
        // buildsystem/release/README.md): release code (R8, the Baseline Profile), neither
        // debuggable nor profileable, but signed with the shared debug key as app.nagmedar.debug,
        // so that it installs over the debug build as an update and keeps its library and settings
        personal {
            initWith release
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
            applicationIdSuffix ".debug"
            debuggable = false
            jniDebuggable = false
            profileable = false
        }
        debug {
            applicationIdSuffix ".debug"
            jniDebuggable true
        }
        dev {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }

    sourceSets.release {
        manifest.srcFile 'flavors/release/AndroidManifest.xml'
    }
    sourceSets.signedRelease {
        manifest.srcFile 'flavors/release/AndroidManifest.xml'
    }
    sourceSets.benchmark {
        manifest.srcFile 'flavors/release/AndroidManifest.xml'
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    splits {
        abi {
            enable = splitBuild
            reset()
            if (nagmedarAbis) include(*nagmedarAbis) else include("x86", "x86_64", "armeabi-v7a", "arm64-v8a")
        }
    }

    def abiCodes = ['armeabi-v7a': 5, 'arm64-v8a': 6, 'x86': 7, 'x86_64': 8]
    lint {
        abortOnError = false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
    namespace = 'org.videolan.mobile.app'
    // make per-variant version code
    applicationVariants.all { variant ->
        //Custom APK name and versionCode
        variant.outputs.each { output ->
            def outputAbi = output.getFilter(com.android.build.OutputFile.ABI)
            def abiName = outputAbi ?: "all"
            def versionCode = abiCodes.get(abiName, 0)
            if (variant.buildType.name == "vlcBundle") {
                versionCode = 9
            }

            output.versionCodeOverride = 10000000 + defaultConfig.versionCode + versionCode
            def outputName = "Nagmedar-"
            outputName += variant.versionName.replace(" ", "-")
            if (variant.buildType.name == "debug") outputName += "-debug"
            if (variant.buildType.name == "benchmark") outputName += "-benchmark"
            if (variant.buildType.name == "personal") outputName += "-personal"
            outputName += "-" + abiName + ".apk"
            output.outputFileName = outputName
        }
    }
}

dependencies {
    implementation project(':application:vlc-android')
    implementation project(':application:nagmedar-ui')
    implementation project(':application:television')
    implementation project(':application:remote-access-server')
    testImplementation project(':application:television')
    testImplementation project(':application:remote-access-server')

    androidTestImplementation "androidx.test.espresso:espresso-contrib:$rootProject.espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$rootProject.espressoVersion"
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.room:room-testing:$rootProject.ext.roomVersion"
    testImplementation "androidx.arch.core:core-testing:$rootProject.ext.archVersion"
    androidTestImplementation "androidx.arch.core:core-testing:$rootProject.ext.archVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.junitExtVersion"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$rootProject.ext.desugarLib"
    implementation "androidx.profileinstaller:profileinstaller:$rootProject.ext.profileInstallerVersion"
    androidTestUtil "androidx.test:orchestrator:$rootProject.ext.orchestrator"
    testImplementation "androidx.test:core:$rootProject.ext.testCore"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.kotlinx_version"
    testImplementation "org.mockito:mockito-core:$rootProject.ext.mockito"
    testImplementation "io.mockk:mockk:$rootProject.ext.mockk"
    testImplementation "org.powermock:powermock-api-mockito2:$rootProject.ext.powerMock"
    testImplementation "org.powermock:powermock-module-junit4:$rootProject.ext.powerMock"
    testImplementation "com.jraska.livedata:testing-ktx:$rootProject.ext.livedataTest"
    testImplementation "org.robolectric:robolectric:$rootProject.ext.robolectric"
    androidTestImplementation "com.android.support:multidex:1.0.3"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.2.0"
    androidTestImplementation "androidx.test:rules:$rootProject.ext.testCore"
    androidTestImplementation 'com.jraska:falcon:2.2.0'
    androidTestImplementation 'tools.fastlane:screengrab:2.1.0'
}
