// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    // Nağmedar 1.0.3: the platform of Desktop Kit 2.3.0 (Compose 1.12 needs AGP 9.1.1+ and compileSdk
    // 37; Haze 2 is built with Kotlin 2.4). settings.gradle's com.android.settings takes the same AGP
    ext.android_plugin_version = '9.4.1'
    ext.kotlin_version = '2.4.20'
    ext.kotlinx_version = '1.11.0'
    repositories {
        flatDir dirs: "gradle/plugins"
        google()
        mavenCentral()
        mavenLocal()
   }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.34.0'
    }
}

plugins {
    // KSP 2.3.10 reads Kotlin 2.4's default module names; 2.3.x is independent of the Kotlin version
    id 'com.google.devtools.ksp' version '2.3.11' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    tasks.withType(Javadoc) {
        // Ignores errors from mavenAndroidJavadocs task
        // (reference: github.com/novoda/bintray-release/issues/71#issuecomment-164324255)
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption('encoding', 'UTF-8')
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlin {
            compilerOptions {
                jvmTarget.set(rootProject.ext.targetJVMKotlin)
                optIn.add("kotlin.RequiresOptIn")
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = rootProject.ext.targetJVM.toString()
        targetCompatibility = rootProject.ext.targetJVM.toString()
    }

    // Nağmedar CI: a test that hangs fails its task instead of holding the job for two hours, and
    // the log names each test as it starts and ends, so the one that hung is the one left open
    tasks.withType(Test).configureEach {
        timeout.set(java.time.Duration.ofMinutes(25))
        if (System.getenv('CI')) {
            beforeTest { descriptor -> logger.lifecycle("test started: ${descriptor.className} ${descriptor.name}") }
            afterTest { descriptor, result -> logger.lifecycle("test ended: ${descriptor.className} ${descriptor.name} ${result.resultType}") }
        }
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility rootProject.ext.targetJVM
                    targetCompatibility rootProject.ext.targetJVM
                }
            }
        }
    }
}

ext {
    appId = "app.nagmedar" // Nağmedar; code namespaces stay org.videolan.*
    // Nağmedar 1.0.8. versionCode = 4000000 + major * 10000 + minor * 100 + patch (minor and patch
    // 0 to 99); the 4000000 base keeps it above the VLC 3.x codes that StartActivity's settings
    // migrations compare against. An APK's own code is 10000000 + this + its ABI's digit
    // (app/build.gradle): 14010014 for the arm64 personal build of 1.0.8, 14010008 for a debug one.
    versionCode = 4010008
    // libVLC 4 by default; -PforceVlc3 selects the VLC 3 branch (-PforceVlc4 is accepted and ignored)
    vlcMajorVersion = project.hasProperty('forceVlc3') ? 3 : 4
    versionName = vlcMajorVersion == 3 ? '1.0.8-vlc3' : '1.0.8'
    remoteAccessVersion = '0.24.0'
    libvlcVersion = vlcMajorVersion == 3 ? '3.7.7' :'4.0.0-eap29'
    medialibraryVersion = (vlcMajorVersion == 3 ? '0.13.24' : '0.13.22-vlc4')

    // Nağmedar 1.0.3: Java 17 bytecode, as Desktop Kit 2's. Compose 1.12 and the AndroidX releases with it
    // are built for Java 11, and Kotlin cannot inline their functions into older bytecode; D8 turns it into
    // what Android 14 runs
    targetJVM = JavaVersion.VERSION_17
    targetJVMKotlin = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17

    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    // default ndkVersion in  android_plugin_version in 8.9.1: 27.0.12077973
    // VLC 3 needs to stick to NDK21 which is the last one supporting Android API 17
    toolchainNdkVersion = properties.getProperty('android.ndkFullVersion') ?: (vlcMajorVersion == 3 ? '21.4.7075529' : '28.2.13676358')
    tooclchainNdkPath = properties.getProperty('android.ndkPath')
    // Nağmedar 1.0.3: compiled against Android 17 (API 37) and targeting it (the owner's decision of
    // 12 Nov 2026): the local network permission, the background audio rules and the widget bitmap
    // limit that come with 37 are handled (buildsystem/release/README.md)
    targetSdkVersion = 37
    compileSdkVersion = 37
    desugarLib = '2.0.4'
    androidxLegacyVersion = '1.0.0'
    androidxCoreVersion = '1.12.0'
    appCompatVersion = '1.6.1'
    lifecycleVersion = '2.5.1'
    androidxPreferencesVersion = '1.2.1'
    androidxActivityVersion = '1.8.2'
    androidxFragmentVersion = '1.6.2'
    androidxAnnotationVersion = '1.7.1'
    androidxRecyclerviewVersion = '1.3.2'
    androidxLeanbackVersion = '1.0.0'
    androidxMaterialVersion = '1.11.0'
    constraintLayoutVersion = '2.1.4'
    windowVersion = '1.1.0'
    mediaVersion = '1.7.0'
    carVersion = '1.7.0-beta03'
    jdbcVersion =  '3.36.0'
    viewPager2Version = "1.0.0"
    archVersion = '2.2.0'
    roomVersion = '2.6.1'
    pagingVersion = '3.2.1'
    junitVersion = '4.13.2'
    junitExtVersion = '1.1.5'
    mockito = '2.25.0'
    moshi = '1.8.0'
    ktorVersion = '2.3.7'
    powerMock = '2.0.2'
    espressoVersion = '3.5.1'
    livedataTest = '1.2.0'
    robolectric = '4.3.1'
    mockk = '1.9.3'
    testRunner = '1.4.0'
    orchestrator = '1.4.2'
    testCore = '1.5.0'
    // Nağmedar Compose UI (application/nagmedar-ui), on Desktop Kit 2.3.0's platform: Compose 1.12.1
    composeBomVersion = '2026.09.00'
    activityComposeVersion = '1.13.0'
    // 2.10 plays the predictive Back of a pop as the shell's page pop (NagmedarShell's predictivePop*)
    navigationComposeVersion = '2.10.2'
    // Desktop Kit 2's frosted glass: the typed hazeBlur, one style per material (theme/Glass.kt)
    hazeVersion = '2.0.1'
    lifecycleComposeVersion = '2.11.0'
    // 4.17 runs Android 16 (API 36) too; the tests stay on API 34 (robolectric.properties)
    nagmedarRobolectricVersion = '4.17'
    // S-1010: the converter's jobs (application/nagmedar-ui)
    workManagerVersion = '2.10.5'
    // S-1404: the macrobenchmarks (application/benchmark)
    macrobenchmarkVersion = '1.3.4'
    // Nağmedar 1.0: installs the Baseline Profile (application/app/src/main/baselineProfiles) on a
    // sideloaded APK, which no store compiles ahead of time
    profileInstallerVersion = '1.4.1'
    uiautomatorVersion = '2.3.0'
    media3Version = '1.4.1'
    publishScriptPath = '../../buildsystem/publish.gradle'
//    versionCode scheme is T M NN RR AA
//    T: Target/Flavour (1 for Android, 2 for Chrome?)
//    M: Major version from 0 to 9
//    NN: Minor version from 00 to 99
//    RR: Micro/Revision version from 00 to 99
//    AA: ABI from 0 to 99
//    Starting from 13050420 the last digit represents the ABI and the variant (normal or NoTv)
//    Also, the values are sorted to allow the most pertinent version to be prioritized
//
//    Old values
//    0 is dev
//    1 was ARMv5        (deprecated)
//    2 was ARMv6-nofpu  (deprecated)
//    3 was ARMv6-fpu    (deprecated)
//    4 is ARMv7-A
//    5 is x86
//    6 is MIPS
//    7 is ARMv8
//    8 is x86_64
//    9 is MIPS64
//
//    New values
//    0 is dev
//    1 is ARMv7-A No TV
//    2 is ARMv8 No TV
//    3 is x86 No TV
//    4 is x86_64 No TV
//    5 is ARMv7-A
//    6 is ARMv8
//    7 is x86
//    8 is ARMv7-A
}
